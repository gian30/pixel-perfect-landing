<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <nav class="navigation">
                <a href="index.html"> <img src="assets/logos/circle.svg" alt="circle logo" class="logo"></a>
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                    <li><a href="index.html#services">Services</a></li>
                </ul>
                <a href="contact.html" class="contact-us-button circle-button">Contact Us</a>
            </nav>
        </div>
    </header>

    <section class="contact-us">
        <div class="container">
            <h1>Contact Us</h1>
            <form action="" class="contact-form">
                <div class="form-line">
                    <div class="form-control">
                        <label for="name" required>Full Name *</label>
                        <input class="form-input input-name" name="name" type="text" placeholder="Enter your full name"
                            required>
                    </div>
                </div>
                <div class="form-line">
                    <div class="form-control">
                        <label for="email">Email</label>
                        <input class="form-input input-email" name="email" type="email"
                            placeholder="Enter your email address" required>
                    </div>
                    <div class="form-control">
                        <label for="phone">Phone</label>
                        <input class="form-input input-phone" name="phone" type="text"
                            placeholder="Enter your phone number" required>
                    </div>
                </div>
                <div class="form-line">
                    <div class="form-control">
                        <label for="message">Message</label>
                        <textarea class="form-input input-message" name="message" type="text"
                            placeholder="Write your message here ..." required></textarea>
                    </div>
                </div>
                <button class="circle-button form-button" id="contact-submit" type="submit">Submit</button>
            </form>
        </div>

    </section>
    <!-- The Modal -->
    <div id="myModal" class="modal">

        <!-- Modal content -->
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="modal-text"></p>
        </div>

    </div>
    <footer>
        <div class="container">
            <div class="footer-company">
                <img src="/assets/logos/circle.svg" alt="circle-logo">
                <p class="footer-address">
                    2972 Westheimer Rd. Santa Ana, <br> Illinois 85486
                </p>
            </div>
            <nav class="footer-nav">
                <ul>
                    <li><a href="#">Team</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Press</a></li>
                    <li><a href="#">Projects</a></li>
                    <li><a href="#">Privacy Policy</a></li>
                </ul>
            </nav>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
